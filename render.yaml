services:
  - type: web
    name: datasentinel
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run datasentinel/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
